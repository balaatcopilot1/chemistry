<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 12 Chemistry Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14212b;--mute:#5a6b78;--line:#cfdbe3;--accent:#0b6e8a;--accent-ink:#fff;--ok:#1d6b3a;--ansbg:#e6f3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--card:#17252e;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3e4a;--accent:#4fc0dc;--accent-ink:#06222b;--ok:#7fd6a0;--ansbg:#16301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Public Sans",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:820px;margin:auto}
h1{font:700 2rem/1.15 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--mute);margin:6px 0 0}
main{max-width:820px;margin:auto;padding:16px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cat{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px}
.cat:hover,.cat:focus-visible{border-color:var(--accent);outline:none}
.cat b{font:700 1.5rem Fraunces,Georgia,serif;display:block}
.cat span{color:var(--mute);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px;color:var(--mute);font-size:.95rem}
a.back{color:var(--accent);text-decoration:none;font-weight:600}
.q{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px 24px}
.q p{margin:.5em 0}.q ul,.q ol{padding-left:1.3em}.q li{margin:.3em 0}
.q table{border-collapse:collapse}.q td,.q th{border:1px solid var(--line);padding:4px 10px}
.q img{max-width:100%}
.ans{margin-top:16px;background:var(--ansbg);border-left:5px solid var(--ok);padding:6px 18px;border-radius:6px}
.link{background:none;border:0;color:var(--accent);font:600 1rem inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:12px 0}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.b{font:600 1rem "Public Sans",sans-serif;padding:10px 18px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.b.main{background:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk span{margin-left:auto;color:var(--mute);font-size:.9rem}
.q hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.tag{display:inline-block;font-size:.85rem;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:0 10px;margin-bottom:6px}
h2{font:700 1.4rem Fraunces,Georgia,serif;margin:8px 0 14px}
.link.back{padding:0;text-decoration:none;font-size:inherit}
.msg{padding:30px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Class 12 Chemistry Practice</h1><p class="sub">Pick a section and your chapters. Each set has 10 random questions, shown one at a time.</p></header>
<main id="app"><div class="msg">Loading…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const CATS=["One Marks","Two Marks","Three Marks","Five Marks"], SET=10;
const app=document.getElementById('app');
let manifest=null, S=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>marked.parse(t,{breaks:true});
const key=s=>s.trim().toLowerCase();
const used=c=>new Set(JSON.parse(sessionStorage.getItem('used:'+c)||'[]'));
const saveUsed=(c,s)=>sessionStorage.setItem('used:'+c,JSON.stringify([...s]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

// ---- Question file: "Chapter: ..." line, question + options, "## Answer" heading, answer ----
const CH_RE=/^[ \t]*(?:\*\*)?Chapter(?:\*\*)?[ \t]*:(?:\*\*)?[ \t]*(.+?)[ \t]*$/im;
function parse(text){
  text=text.replace(/^\uFEFF/,'').replace(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*\r?\n/,(m,fm)=>fm+'\n');
  let chapter='Other';const c=text.match(CH_RE);
  if(c){chapter=c[1].replace(/\*+/g,'').trim()||'Other';text=text.replace(c[0],'')}
  const m=text.match(/^#{1,6}[ \t]*Answer[ \t]*:?[ \t]*$/im);
  if(!m)return{chapter,q:text.trim(),a:'*No answer provided.*'};
  return{chapter,q:text.slice(0,m.index).trim(),a:text.slice(m.index+m[0].length).trim()};
}

async function loadManifest(){
  if(manifest)return manifest;
  try{const r=await fetch('Questions/manifest.json',{cache:'no-cache'});if(!r.ok)throw 0;manifest=await r.json()}
  catch{manifest=await viaApi()}
  return manifest;
}
// Fallback if manifest.json is missing: list files with the GitHub API and read each chapter
async function viaApi(){
  const m=location.hostname.match(/^(.+)\.github\.io$/),repo=location.pathname.split('/')[1],out={};
  for(const c of CATS){
    out[c]=[];
    if(!m||!repo)continue;
    try{
      const r=await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/Questions/${encodeURIComponent(c)}`);
      const files=(await r.json()).filter(f=>f.name.toLowerCase().endsWith('.md'));
      out[c]=await Promise.all(files.map(async f=>({file:f.name,chapter:parse(await (await fetch(f.download_url)).text()).chapter})));
    }catch{}
  }
  return out;
}
const entries=c=>(manifest[c]||[]).map(e=>typeof e==='string'?{file:e,chapter:'Other'}:e);

async function home(){
  await loadManifest();
  app.innerHTML='<div class="grid">'+CATS.map(c=>{
    const n=entries(c).length;
    return `<a class="cat" href="#/${encodeURIComponent(c)}"><b>${c}</b><span>${n} question${n==1?'':'s'}</span></a>`}).join('')+'</div>';
}

// ---- Chapter selection ----
async function chapters(cat){
  await loadManifest();
  const es=entries(cat);
  if(!es.length){app.innerHTML=`<p><a class="back" href="#/">‹ All sections</a></p><div class="msg">No questions in “${cat}” yet. Add .md files to Questions/${cat}/.</div>`;return}
  const map=new Map();
  es.forEach(e=>{const k=key(e.chapter||'Other');if(!map.has(k))map.set(k,{name:e.chapter||'Other',n:0});map.get(k).n++});
  const list=[...map].sort((a,b)=>a[1].name.localeCompare(b[1].name));
  app.innerHTML=`<p><a class="back" href="#/">‹ All sections</a></p>
  <h2>${cat}: choose chapters</h2>
  <div class="q"><label class="chk"><input type="checkbox" id="all" checked><b>All Chapters</b><span>${es.length}</span></label><hr>
  ${list.map(([k,c])=>`<label class="chk"><input type="checkbox" class="ch" value="${esc(k)}">${esc(c.name)}<span>${c.n}</span></label>`).join('')}</div>
  <div class="nav"><button class="b main" id="go">Start practice</button></div>`;
  const all=document.getElementById('all'),chs=[...document.querySelectorAll('.ch')],go=document.getElementById('go');
  const sync=()=>{go.disabled=!all.checked&&!chs.some(x=>x.checked)};
  all.onchange=()=>{if(all.checked)chs.forEach(x=>x.checked=false);sync()};
  chs.forEach(x=>x.onchange=()=>{if(x.checked)all.checked=false;sync()});
  sync();
  go.onclick=()=>pull(cat,all.checked?null:chs.filter(x=>x.checked).map(x=>x.value));
}

// ---- Pull up to 10 unseen questions from the selected chapters (null = all) ----
async function pull(cat,sel,restart){
  await loadManifest();
  const pool=entries(cat).filter(e=>!sel||sel.includes(key(e.chapter||'Other')));
  const u=used(cat);
  if(restart){pool.forEach(e=>u.delete(e.file));saveUsed(cat,u)}
  const fresh=pool.filter(e=>!u.has(e.file));
  if(!fresh.length){
    app.innerHTML=`<p><button class="link back" id="bk">‹ Chapters</button></p><div class="msg">You have finished all ${pool.length} questions in the selected chapters this session.<br><br><button class="b main" id="again">Start again</button></div>`;
    document.getElementById('bk').onclick=()=>chapters(cat);
    document.getElementById('again').onclick=()=>pull(cat,sel,true);return}
  const pick=shuffle(fresh).slice(0,SET);
  app.innerHTML='<div class="msg">Loading questions…</div>';
  const base='Questions/'+encodeURIComponent(cat)+'/';
  const qs=(await Promise.all(pick.map(async e=>{
    try{const r=await fetch(base+encodeURIComponent(e.file));if(!r.ok)throw 0;return{file:e.file,...parse(await r.text())}}catch{return null}
  }))).filter(Boolean);
  pick.forEach(e=>u.add(e.file));saveUsed(cat,u);
  S={cat,sel,qs,i:0,show:false,left:fresh.length-pick.length};
  render();
}

function render(){
  const{cat,sel,qs,i,show,left}=S,q=qs[i],last=i===qs.length-1;
  app.innerHTML=`
  <div class="bar"><span><a class="back" href="#/">‹ All sections</a> &nbsp; <button class="link back" id="bk">Chapters</button></span><span>${cat} · Question ${i+1} of ${qs.length}</span></div>
  <article class="q"><div class="tag">${esc(q.chapter)}</div>${md(q.q)}
    <button class="link" id="tog" aria-expanded="${show}">${show?'Hide Answer':'Show Answer'}</button>
    ${show?`<div class="ans">${md(q.a)}</div>`:''}
  </article>
  <div class="nav">
    <button class="b" id="prev" ${i===0?'disabled':''}>Previous</button>
    <button class="b main" id="next" ${last?'disabled':''}>Next</button>
    <button class="b" id="more">${left>0?'Pull next 10 questions':'Start again'}</button>
  </div>
  <p class="bar">${left>0?left+' unseen question'+(left==1?'':'s')+' left in the selected chapters':'No unseen questions left in the selected chapters'}</p>`;
  document.getElementById('bk').onclick=()=>chapters(cat);
  document.getElementById('tog').onclick=()=>{S.show=!S.show;render()};
  document.getElementById('prev').onclick=()=>{S.i--;S.show=false;render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{S.i++;S.show=false;render();scrollTo(0,0)};
  document.getElementById('more').onclick=()=>pull(cat,sel,left<=0);
}

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(CATS.includes(h))chapters(h);else home();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
