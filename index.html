<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 12 Chemistry Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14212b;--mute:#5a6b78;--line:#cfdbe3;--accent:#0b6e8a;--accent-ink:#fff;--ok:#1d6b3a;--ansbg:#e6f3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--card:#17252e;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3e4a;--accent:#4fc0dc;--accent-ink:#06222b;--ok:#7fd6a0;--ansbg:#16301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Public Sans",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:820px;margin:auto}
h1{font:700 2rem/1.15 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--mute);margin:6px 0 0}
main{max-width:820px;margin:auto;padding:16px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cat{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px}
.cat:hover,.cat:focus-visible{border-color:var(--accent);outline:none}
.cat b{font:700 1.5rem Fraunces,Georgia,serif;display:block}
.cat span{color:var(--mute);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px;color:var(--mute);font-size:.95rem}
a.back{color:var(--accent);text-decoration:none;font-weight:600}
.q{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px 24px}
.q p{margin:.5em 0}.q ul,.q ol{padding-left:1.3em}.q li{margin:.3em 0}
.q table{border-collapse:collapse}.q td,.q th{border:1px solid var(--line);padding:4px 10px}
.q img{max-width:100%}
.ans{margin-top:16px;background:var(--ansbg);border-left:5px solid var(--ok);padding:6px 18px;border-radius:6px}
.link{background:none;border:0;color:var(--accent);font:600 1rem inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:12px 0}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.b{font:600 1rem "Public Sans",sans-serif;padding:10px 18px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.b.main{background:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{padding:30px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Class 12 Chemistry Practice</h1><p class="sub">Pick a section. Each set has 10 random questions, shown one at a time.</p></header>
<main id="app"><div class="msg">Loading…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const CATS=["One Marks","Two Marks","Three Marks","Five Marks"], SET=10;
const app=document.getElementById('app');
let manifest=null, S=null;

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>marked.parse(t,{breaks:true});
const used=c=>new Set(JSON.parse(sessionStorage.getItem('used:'+c)||'[]'));
const saveUsed=(c,s)=>sessionStorage.setItem('used:'+c,JSON.stringify([...s]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

async function loadManifest(){
  if(manifest)return manifest;
  try{const r=await fetch('Questions/manifest.json',{cache:'no-cache'});if(!r.ok)throw 0;manifest=await r.json()}
  catch{manifest=await viaApi()}
  return manifest;
}
// Fallback if manifest.json is missing: ask the GitHub API (public repos on github.io)
async function viaApi(){
  const m=location.hostname.match(/^(.+)\.github\.io$/),repo=location.pathname.split('/')[1],out={};
  for(const c of CATS){
    out[c]=[];
    if(!m||!repo)continue;
    try{const r=await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/Questions/${encodeURIComponent(c)}`);
      out[c]=(await r.json()).filter(f=>f.name.toLowerCase().endsWith('.md')).map(f=>f.name)}catch{}
  }
  return out;
}

// A question file: question + options, then a heading line "## Answer", then the answer.
function parse(text){
  const m=text.match(/^#{1,6}[ \t]*Answer[ \t]*:?[ \t]*$/im);
  if(!m)return{q:text,a:'*No answer provided.*'};
  return{q:text.slice(0,m.index).trim(),a:text.slice(m.index+m[0].length).trim()};
}

async function home(){
  const mf=await loadManifest();
  app.innerHTML='<div class="grid">'+CATS.map(c=>{
    const n=(mf[c]||[]).length;
    return `<a class="cat" href="#/${encodeURIComponent(c)}"><b>${c}</b><span>${n} question${n==1?'':'s'}</span></a>`}).join('')+'</div>';
}

async function pull(cat,restart){
  const mf=await loadManifest(), all=mf[cat]||[];
  if(restart)saveUsed(cat,new Set());
  const u=used(cat), fresh=all.filter(f=>!u.has(f));
  if(!all.length){app.innerHTML=`<p><a class="back" href="#/">‹ All sections</a></p><div class="msg">No questions in “${cat}” yet. Add .md files to Questions/${cat}/.</div>`;return}
  if(!fresh.length){
    app.innerHTML=`<p><a class="back" href="#/">‹ All sections</a></p><div class="msg">You have finished all ${all.length} questions in ${cat} this session.<br><br><button class="b main" id="again">Start again</button></div>`;
    document.getElementById('again').onclick=()=>pull(cat,true);return}
  const pick=shuffle(fresh).slice(0,SET);
  app.innerHTML='<div class="msg">Loading questions…</div>';
  const base='Questions/'+encodeURIComponent(cat)+'/';
  const qs=(await Promise.all(pick.map(async f=>{
    try{const r=await fetch(base+encodeURIComponent(f));if(!r.ok)throw 0;return{file:f,...parse(await r.text())}}catch{return null}
  }))).filter(Boolean);
  pick.forEach(f=>u.add(f));saveUsed(cat,u);
  S={cat,qs,i:0,show:false,left:all.length-u.size};
  render();
}

function render(){
  const{cat,qs,i,show,left}=S,q=qs[i],last=i===qs.length-1;
  app.innerHTML=`
  <div class="bar"><a class="back" href="#/">‹ All sections</a><span>${cat} · Question ${i+1} of ${qs.length}</span></div>
  <article class="q">${md(q.q)}
    <button class="link" id="tog" aria-expanded="${show}">${show?'Hide Answer':'Show Answer'}</button>
    ${show?`<div class="ans">${md(q.a)}</div>`:''}
  </article>
  <div class="nav">
    <button class="b" id="prev" ${i===0?'disabled':''}>Previous</button>
    <button class="b main" id="next" ${last?'disabled':''}>Next</button>
    <button class="b" id="more">${left>0?'Pull next 10 questions':'Start again'}</button>
  </div>
  <p class="bar">${left>0?left+' unseen question'+(left==1?'':'s')+' left in this section':'No unseen questions left'}</p>`;
  document.getElementById('tog').onclick=()=>{S.show=!S.show;render()};
  document.getElementById('prev').onclick=()=>{S.i--;S.show=false;render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{S.i++;S.show=false;render();scrollTo(0,0)};
  document.getElementById('more').onclick=()=>pull(cat,left<=0);
}

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  if(CATS.includes(h))pull(h);else home();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
