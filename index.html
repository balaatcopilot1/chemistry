<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 12 Chemistry Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f6;--card:#fff;--ink:#14212b;--mute:#5a6b78;--line:#cfdbe3;--accent:#0b6e8a;--accent-ink:#fff;--ok:#1d6b3a;--ansbg:#e6f3ea}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a21;--card:#17252e;--ink:#e6eef3;--mute:#93a6b3;--line:#2b3e4a;--accent:#4fc0dc;--accent-ink:#06222b;--ok:#7fd6a0;--ansbg:#16301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 "Public Sans",system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:820px;margin:auto}
h1{font:700 2rem/1.15 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--mute);margin:6px 0 0}
main{max-width:820px;margin:auto;padding:16px 20px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.cat{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px}
.cat:hover,.cat:focus-visible{border-color:var(--accent);outline:none}
.cat b{font:700 1.5rem Fraunces,Georgia,serif;display:block}
.cat span{color:var(--mute);font-size:.9rem}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 0 14px;color:var(--mute);font-size:.95rem}
a.back{color:var(--accent);text-decoration:none;font-weight:600}
.q{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:22px 24px}
.q p{margin:.5em 0}.q ul,.q ol{padding-left:1.3em}.q li{margin:.3em 0}
.q table{border-collapse:collapse}.q td,.q th{border:1px solid var(--line);padding:4px 10px}
.q img{max-width:100%}
.ans{margin-top:16px;background:var(--ansbg);border-left:5px solid var(--ok);padding:6px 18px;border-radius:6px}
.link{background:none;border:0;color:var(--accent);font:600 1rem inherit;font-family:inherit;text-decoration:underline;cursor:pointer;padding:12px 0}
.nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.b{font:600 1rem "Public Sans",sans-serif;padding:10px 18px;border-radius:8px;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer}
button.b.main{background:var(--accent);color:var(--accent-ink)}
button.b:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chk{display:flex;align-items:center;gap:12px;padding:8px 0;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk span{margin-left:auto;color:var(--mute);font-size:.9rem}
.q hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.tag{display:inline-block;font-size:.85rem;color:var(--accent);border:1px solid var(--accent);border-radius:20px;padding:0 10px;margin-bottom:6px}
h2{font:700 1.4rem Fraunces,Georgia,serif;margin:8px 0 14px}
.link.back{padding:0;text-decoration:none;font-size:inherit}
.q h3{font:600 1.05rem "Public Sans",sans-serif;margin:0 0 4px}
.q.gap{margin-top:16px}
.note{margin:0 0 6px;color:var(--mute);font-size:.88rem}
.tag{margin-right:6px}
h2.sp{margin-top:30px}
button.cat{font:inherit;text-align:left;width:100%;cursor:pointer}
.cat.sm b{font-size:1.1rem}
.msg{padding:30px;text-align:center;color:var(--mute)}
</style>
</head>
<body>
<header><h1>Class 12 Chemistry Practice</h1><p class="sub">Practise by marks or by chapter. Each set has 10 random questions, shown one at a time.</p></header>
<main id="app"><div class="msg">Loading…</div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const CATS=["One Marks","Two Marks","Three Marks","Four Marks","Five Marks"], SET=10;
const app=document.getElementById('app');
let manifest=null, S=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=t=>marked.parse(t,{breaks:true});
const key=s=>s.trim().toLowerCase();
const used=c=>new Set(JSON.parse(sessionStorage.getItem('used:'+c)||'[]'));
const saveUsed=(c,s)=>sessionStorage.setItem('used:'+c,JSON.stringify([...s]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fieldRe=n=>new RegExp('^[ \\t]*(?:\\*\\*)?'+n+'(?:\\*\\*)?[ \\t]*:(?:\\*\\*)?[ \\t]*(.+?)[ \\t]*$','im');
const CH_RE=fieldRe('Chapter'), PA_RE=fieldRe('Paper');
// paper name: "Paper:" line, else the file name (Mar2024-Q05.md -> Mar2024)
const paperOf=(file,paper)=>paper||file.replace(/\.md$/i,'').replace(/[-_ ]*Q\d+.*$/i,'')||'Other';

// ---- Question file: "Chapter:" and "Paper:" lines, question + options, "## Answer" heading, answer ----
function parse(text){
  text=text.replace(/^\uFEFF/,'').replace(/^---[ \t]*\r?\n([\s\S]*?)\r?\n---[ \t]*\r?\n/,(m,fm)=>fm+'\n');
  let chapter='Other',paper='';
  const c=text.match(CH_RE);if(c){chapter=c[1].replace(/\*+/g,'').trim()||'Other';text=text.replace(c[0],'')}
  const p=text.match(PA_RE);if(p){paper=p[1].replace(/\*+/g,'').trim();text=text.replace(p[0],'')}
  const m=text.match(/^#{1,6}[ \t]*Answer[ \t]*:?[ \t]*$/im);
  if(!m)return{chapter,paper,q:text.trim(),a:'*No answer provided.*'};
  return{chapter,paper,q:text.slice(0,m.index).trim(),a:text.slice(m.index+m[0].length).trim()};
}

async function loadManifest(){
  if(manifest)return manifest;
  try{const r=await fetch('Questions/manifest.json',{cache:'no-cache'});if(!r.ok)throw 0;manifest=await r.json()}
  catch{manifest=await viaApi()}
  return manifest;
}
// Fallback if manifest.json is missing: list files with the GitHub API and read each file
async function viaApi(){
  const m=location.hostname.match(/^(.+)\.github\.io$/),repo=location.pathname.split('/')[1],out={};
  for(const c of CATS){
    out[c]=[];
    if(!m||!repo)continue;
    try{
      const r=await fetch(`https://api.github.com/repos/${m[1]}/${repo}/contents/Questions/${encodeURIComponent(c)}`);
      const files=(await r.json()).filter(f=>f.name.toLowerCase().endsWith('.md'));
      out[c]=await Promise.all(files.map(async f=>{const p=parse(await (await fetch(f.download_url)).text());return{file:f.name,chapter:p.chapter,paper:p.paper}}));
    }catch{}
  }
  return out;
}
const entries=c=>(manifest[c]||[]).map(e=>typeof e==='string'?{file:e,chapter:'Other',paper:paperOf(e,'')}:{...e,chapter:e.chapter||'Other',paper:paperOf(e.file,e.paper)});
const group=(list,f)=>{const m=new Map();list.forEach(e=>{const k=key(e[f]);if(!m.has(k))m.set(k,{name:e[f],n:0});m.get(k).n++});
  return [...m].sort((a,b)=>a[1].name.localeCompare(b[1].name,undefined,{numeric:true}))};

const allEntries=()=>CATS.flatMap(c=>entries(c).map(e=>({...e,cat:c})));

async function home(){
  await loadManifest();
  const chs=group(allEntries(),'chapter');
  app.innerHTML='<h2>Practice by marks</h2><div class="grid">'+CATS.map(c=>{
    const n=entries(c).length;
    return `<a class="cat" href="#/${encodeURIComponent(c)}"><b>${c}</b><span>${n} question${n==1?'':'s'}</span></a>`}).join('')+'</div>'+
    '<h2 class="sp">Practice by chapter</h2><div class="grid">'+(chs.length?chs.map(([k,c])=>
    `<a class="cat sm" href="#/chapter/${encodeURIComponent(k)}"><b>${esc(c.name)}</b><span>${c.n} question${c.n==1?'':'s'}</span></a>`).join(''):'<div class="msg">No questions yet.</div>')+'</div>';
}

// ---- Chapter page: which mark sections have questions for this chapter ----
async function chapterPage(k){
  await loadManifest();
  const es=allEntries().filter(e=>key(e.chapter)===k);
  if(!es.length){app.innerHTML='<p><a class="back" href="#/">‹ Home</a></p><div class="msg">Chapter not found.</div>';return}
  app.innerHTML=`<p><a class="back" href="#/">‹ Home</a></p><h2>${esc(es[0].chapter)}</h2><p class="note">Choose a section.</p><div class="grid">`+
    CATS.filter(c=>es.some(e=>e.cat===c)).map(c=>{const n=es.filter(e=>e.cat===c).length;
      return `<button class="cat" data-c="${c}"><b>${c}</b><span>${n} question${n==1?'':'s'}</span></button>`}).join('')+'</div>';
  app.querySelectorAll('button.cat').forEach(b=>b.onclick=()=>chapters(b.dataset.c,{chapters:[k],from:k}));
}

// ---- Paper + chapter selection ----
async function chapters(cat,init){
  init=init||{};
  await loadManifest();
  const es=entries(cat);
  if(!es.length){app.innerHTML=`<p><a class="back" href="#/">‹ Home</a></p><div class="msg">No questions in “${cat}” yet. Add .md files to Questions/${cat}/.</div>`;return}
  let allP=!init.papers,selP=new Set(init.papers||[]),allC=!init.chapters,selC=new Set(init.chapters||[]);
  const from=init.from||'',fromName=from?((allEntries().find(e=>key(e.chapter)===from)||{}).chapter||''):'';
  app.innerHTML=`<p><a class="back" href="#/">‹ Home</a>${from?` &nbsp; <a class="back" href="#/chapter/${encodeURIComponent(from)}">‹ ${esc(fromName)}</a>`:''}</p>
  <h2>${cat}: choose papers and chapters</h2>
  <div class="q"><h3>Papers</h3><div id="pl"></div></div>
  <div class="q gap"><h3>Chapters</h3><p class="note">Only chapters found in the selected papers are listed.</p><div id="cl"></div></div>
  <div class="nav"><button class="b main" id="go">Start practice</button></div>`;
  const pl=document.getElementById('pl'),cl=document.getElementById('cl'),go=document.getElementById('go');
  const inP=e=>allP||selP.has(key(e.paper));
  const sync=()=>{go.disabled=(!allP&&!selP.size)||(!allC&&!selC.size)};
  pl.innerHTML=`<label class="chk"><input type="checkbox" id="allP"${allP?' checked':''}><b>All Papers</b><span>${es.length}</span></label><hr>`+
    group(es,'paper').map(([k,p])=>`<label class="chk"><input type="checkbox" class="pp" value="${esc(k)}"${selP.has(k)?' checked':''}>${esc(p.name)}<span>${p.n}</span></label>`).join('');
  const drawC=()=>{
    const pool=es.filter(inP),cs=group(pool,'chapter');
    selC=new Set([...selC].filter(k=>cs.some(c=>c[0]===k)));
    if(!allC&&!selC.size)allC=true;
    cl.innerHTML=`<label class="chk"><input type="checkbox" id="allC"${allC?' checked':''}><b>All Chapters</b><span>${pool.length}</span></label><hr>`+
      cs.map(([k,c])=>`<label class="chk"><input type="checkbox" class="cc" value="${esc(k)}"${selC.has(k)?' checked':''}>${esc(c.name)}<span>${c.n}</span></label>`).join('');
    sync();
  };
  pl.onchange=e=>{const t=e.target;
    if(t.id==='allP'){allP=t.checked;if(allP){selP.clear();pl.querySelectorAll('.pp').forEach(x=>x.checked=false)}}
    else{t.checked?selP.add(t.value):selP.delete(t.value);if(t.checked){allP=false;document.getElementById('allP').checked=false}}
    drawC()};
  cl.onchange=e=>{const t=e.target;
    if(t.id==='allC'){allC=t.checked;if(allC){selC.clear();cl.querySelectorAll('.cc').forEach(x=>x.checked=false)}}
    else{t.checked?selC.add(t.value):selC.delete(t.value);if(t.checked){allC=false;document.getElementById('allC').checked=false}}
    sync()};
  drawC();
  go.onclick=()=>pull(cat,{papers:allP?null:[...selP],chapters:allC?null:[...selC],from});
}

// ---- Pull up to 10 unseen questions matching the selected papers and chapters (null = all) ----
async function pull(cat,sel,restart){
  await loadManifest();
  const pool=entries(cat).filter(e=>(!sel.papers||sel.papers.includes(key(e.paper)))&&(!sel.chapters||sel.chapters.includes(key(e.chapter))));
  const u=used(cat);
  if(restart){pool.forEach(e=>u.delete(e.file));saveUsed(cat,u)}
  const fresh=pool.filter(e=>!u.has(e.file));
  if(!fresh.length){
    app.innerHTML=`<p><button class="link back" id="bk">‹ Papers and chapters</button></p><div class="msg">You have finished all ${pool.length} questions in your selection this session.<br><br><button class="b main" id="again">Start again</button></div>`;
    document.getElementById('bk').onclick=()=>chapters(cat,sel);
    document.getElementById('again').onclick=()=>pull(cat,sel,true);return}
  const pick=shuffle(fresh).slice(0,SET);
  app.innerHTML='<div class="msg">Loading questions…</div>';
  const base='Questions/'+encodeURIComponent(cat)+'/';
  const qs=(await Promise.all(pick.map(async e=>{
    try{const r=await fetch(base+encodeURIComponent(e.file));if(!r.ok)throw 0;return{file:e.file,...parse(await r.text()),paper:e.paper}}catch{return null}
  }))).filter(Boolean);
  pick.forEach(e=>u.add(e.file));saveUsed(cat,u);
  S={cat,sel,qs,i:0,show:false,left:fresh.length-pick.length};
  render();
}

function render(){
  const{cat,sel,qs,i,show,left}=S,q=qs[i],last=i===qs.length-1;
  app.innerHTML=`
  <div class="bar"><span><a class="back" href="#/">‹ Home</a> &nbsp; <button class="link back" id="bk">Papers and chapters</button></span><span>${cat} · Question ${i+1} of ${qs.length}</span></div>
  <article class="q"><div><span class="tag">Paper: ${esc(q.paper)}</span><span class="tag">${esc(q.chapter)}</span></div>${md(q.q)}
    <button class="link" id="tog" aria-expanded="${show}">${show?'Hide Answer':'Show Answer'}</button>
    ${show?`<div class="ans">${md(q.a)}</div>`:''}
  </article>
  <div class="nav">
    <button class="b" id="prev" ${i===0?'disabled':''}>Previous</button>
    <button class="b main" id="next" ${last?'disabled':''}>Next</button>
    <button class="b" id="more">${left>0?'Pull next 10 questions':'Start again'}</button>
  </div>
  <p class="bar">${left>0?left+' unseen question'+(left==1?'':'s')+' left in your selection':'No unseen questions left in your selection'}</p>`;
  document.getElementById('bk').onclick=()=>chapters(cat,sel);
  document.getElementById('tog').onclick=()=>{S.show=!S.show;render()};
  document.getElementById('prev').onclick=()=>{S.i--;S.show=false;render();scrollTo(0,0)};
  document.getElementById('next').onclick=()=>{S.i++;S.show=false;render();scrollTo(0,0)};
  document.getElementById('more').onclick=()=>pull(cat,sel,left<=0);
}

function route(){
  const raw=location.hash.replace(/^#\/?/,'');
  if(raw.startsWith('chapter/'))return chapterPage(decodeURIComponent(raw.slice(8)));
  const h=decodeURIComponent(raw);
  if(CATS.includes(h))chapters(h);else home();
}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
